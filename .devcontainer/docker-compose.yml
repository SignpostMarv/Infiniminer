services:
    devcontainer:
        build:
            dockerfile: devcontainer.DockerFile
        restart: always
        command: sleep infinity
        user: vscode
        volumes:
            - ../:/app/:cached
            - infiniminer-archive:/archive/infiniminer/
        environment:
            DOTNET_CLI_TELEMETRY_OPTOUT: 1
            git_init_defaultbranch: "${git_init_defaultbranch:-main}"

volumes:
    infiniminer-archive:
        external: true
